<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AppForge Preview</title>
<style>
  /* Quiet header strip for the preview sign-in window. One accent (indigo),
     everything else gray — matches the library UI. The backend injects
     window.__APPFORGE_PREVIEW_ID__ / __APPFORGE_PREVIEW_URL__ before load. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px;
    color: #1f2329;
    background: #f4f5f7;
    border-bottom: 1px solid #e3e5e9;
    display: flex;
    flex-direction: column;
    user-select: none;
    overflow: hidden;
  }
  .banner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    background: #eef0ff;
    border-bottom: 1px solid #d5d9f5;
    color: #2f3180;
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
  }
  .banner .arrow { font-weight: 700; }
  .banner .dismiss {
    margin-left: auto;
    border: none;
    background: none;
    color: #5b5e66;
    font-size: 14px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
    cursor: pointer;
    flex: none;
  }
  .banner .dismiss:hover { background: #dfe3f7; }
  .banner.hidden { display: none; }
  .controls {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    white-space: nowrap;
    overflow: hidden;
  }
  .badge {
    font-weight: 650;
    flex: none;
  }
  .url {
    color: #5b5e66;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 240px;
    flex: none;
  }
  input[type="text"] {
    font: inherit;
    padding: 6px 10px;
    border: 1px solid #d4d7dc;
    border-radius: 8px;
    background: #fff;
    color: #1f2329;
    width: 150px;
    flex: none;
  }
  input[type="text"]::placeholder { color: #9aa0a8; }
  .spacer { flex: 1 1 auto; }
  button.action {
    font: inherit;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    flex: none;
  }
  button.action:disabled { opacity: 0.55; cursor: default; }
  /* The one big moment: prominent primary action. */
  .primary {
    background: #4f46e5;
    color: #fff;
    font-size: 14px;
    padding: 10px 22px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(79, 70, 229, 0.35);
  }
  .primary:hover:not(:disabled) { background: #4338ca; }
  .ghost { background: transparent; color: #5b5e66; border-color: #d4d7dc; }
  .ghost:hover:not(:disabled) { background: #eceef1; }
  .error { color: #b3261e; font-size: 12px; flex: none; }
</style>
</head>
<body>
  <div class="banner" id="banner">
    <span>Sign in on the site above, then click <strong>Add to the Forge</strong></span>
    <span class="arrow" aria-hidden="true">→</span>
    <button class="dismiss" id="dismiss" aria-label="Dismiss">×</button>
  </div>
  <div class="controls">
    <span class="badge">Preview</span>
    <span class="url" id="url"></span>
    <input id="label" type="text" placeholder="Account label (optional)" maxlength="60" autocomplete="off" />
    <span class="spacer"></span>
    <span class="error" id="msg" role="alert"></span>
    <button id="add" class="action primary">Add to the Forge</button>
    <button id="discard" class="action ghost">Discard</button>
  </div>
<script>
(function () {
  "use strict";
  var id = window.__APPFORGE_PREVIEW_ID__;
  var url = window.__APPFORGE_PREVIEW_URL__ || "";
  var msg = document.getElementById("msg");
  var addBtn = document.getElementById("add");
  var discardBtn = document.getElementById("discard");
  document.getElementById("url").textContent = url;
  document.getElementById("dismiss").addEventListener("click", function () {
    document.getElementById("banner").classList.add("hidden");
  });

  function setBusy(busy) {
    addBtn.disabled = busy;
    discardBtn.disabled = busy;
  }
  function fail(text) {
    msg.textContent = text || "Something went wrong.";
    setBusy(false);
  }
  function getInvoke() {
    // Tauri exposes Rust snake_case params as camelCase to JS.
    if (!id || !window.__TAURI__ || !window.__TAURI__.core || !window.__TAURI__.core.invoke) {
      fail("Preview bridge unavailable — close this window and try again.");
      return null;
    }
    return window.__TAURI__.core.invoke;
  }

  addBtn.addEventListener("click", function () {
    var invoke = getInvoke();
    if (!invoke) return;
    setBusy(true);
    msg.textContent = "";
    var label = document.getElementById("label").value.trim();
    // The backend closes this window on success, so this promise may never
    // resolve — that is the happy path, not an error.
    invoke("preview_add", { previewId: id, label: label || null }).catch(fail);
  });

  discardBtn.addEventListener("click", function () {
    var invoke = getInvoke();
    if (!invoke) return;
    setBusy(true);
    invoke("preview_discard", { previewId: id }).catch(fail);
  });
})();
</script>
</body>
</html>
