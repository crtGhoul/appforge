<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Clipboard history</title>
<style>
  /* Clipboard history popup (v0.9.1, text + images). Quiet, launcher-like:
     one accent, plain labels, everything else gray. Self-contained CSS —
     this page is bundled separately from the main app (see vite.config.ts). */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px;
    color: #1f2329;
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid #e0e2e8;
    border-radius: 12px;
    overflow: hidden;
    user-select: none;
  }
  #root { height: 100%; display: flex; flex-direction: column; }
  .clip-search {
    padding: 10px 12px 8px;
    border-bottom: 1px solid #eceef1;
    flex: none;
  }
  .clip-search input {
    font: inherit;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d4d7dc;
    border-radius: 8px;
    background: #fff;
    color: #1f2329;
    outline: none;
  }
  .clip-search input:focus { border-color: #4f46e5; }
  .clip-search input::placeholder { color: #9aa0a8; }
  .clip-list {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px;
    margin: 0;
    list-style: none;
  }
  .clip-item {
    width: 100%;
    text-align: left;
    font: inherit;
    display: block;
    padding: 8px 10px;
    border: none;
    border-radius: 8px;
    background: none;
    cursor: pointer;
    color: #1f2329;
  }
  .clip-item:hover { background: #f2f3f6; }
  .clip-item.selected { background: #eef0ff; }
  .clip-item .text {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.35;
  }
  .clip-item img.thumb {
    display: block;
    max-width: 200px;
    max-height: 160px;
    width: auto;
    height: auto;
    border-radius: 6px;
    border: 1px solid #e0e2e8;
    background: #f7f8fa;
  }
  .clip-item .meta {
    margin-top: 3px;
    font-size: 11.5px;
    color: #8a8f98;
  }
  .clip-empty {
    padding: 32px 20px;
    text-align: center;
    color: #8a8f98;
    font-size: 13px;
    line-height: 1.5;
  }
  .clip-error {
    padding: 16px 20px;
    color: #b3261e;
    font-size: 13px;
  }
  .clip-foot {
    flex: none;
    padding: 7px 12px;
    border-top: 1px solid #eceef1;
    font-size: 11.5px;
    color: #8a8f98;
    display: flex;
    gap: 12px;
  }
  .clip-foot b { font-weight: 600; color: #6b7078; }
</style>
</head>
<body>
  <div id="root"></div>
<script type="module" src="./src/clipboard.tsx"></script>
</body>
</html>
