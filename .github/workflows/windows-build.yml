name: windows-build

# AppForge — Windows 11 packaging pipeline.
# Produces unsigned NSIS + MSI installers on windows-latest.
# No code signing (test installers; expect SmartScreen click-through).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck + build frontend
        run: npm run build

      - name: Build Tauri bundles (NSIS + MSI)
        env:
          # Signs updater artifacts (.sig files) with the minisign key.
          # Private key is in the TAURI_SIGNING_PRIVATE_KEY repo secret;
          # the key itself was generated locally with no password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: appforge-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload updater signatures
        uses: actions/upload-artifact@v4
        with:
          name: appforge-windows-updater-sigs
          path: src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error
